name: gsoc_unicode_app
description: "GSOC Unicode Flutter App"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  auto_route: ^11.1.0
  auto_size_text: ^3.0.0
  cupertino_icons: ^1.0.8
  dart_icu4x:
    path: packages/dart_icu4x
  dartdoc: ^9.0.1
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.0
  flutter_bloc: ^9.1.1
  flutter_hooks: ^0.21.3+1
  flutter_svg: ^2.0.9
  freezed_annotation: ^3.1.0
  get_it: ^9.2.0
  google_fonts: ^8.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.6.0
  json_annotation: ^4.9.0
  lottie: ^3.3.2
  responsive_framework: ^1.1.0
  rxdart: ^0.28.0

dev_dependencies:
  auto_route_generator: ^10.4.0
  build_runner: ^2.10.4
  flutter_gen_runner: ^5.12.0
  flutter_lints: ^6.0.0
  flutter_localization: ^0.3.3
  flutter_test:
    sdk: flutter
  freezed: ^3.2.4
  integration_test:
    sdk: flutter
  json_serializable: ^6.11.3
  mockito: ^5.4.6
  very_good_analysis: ^9.0.0

flutter:
  uses-material-design: true
  generate: true

  fonts:
  - family: Sunuwar
    fonts:
      - asset: assets/fonts/Sunuwar/NotoSansSunuwar-Regular.ttf
        weight: 100

  - family: Todhri
    fonts:
      - asset: assets/fonts/Todhri/NotoSerifTodhri-Regular.ttf
        weight: 100    
